<!DOCTYPE html>
<!-- Stash viewer: renders the .docx served at /file with docx-preview (Apache-2.0). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=860">
<style>
  /* Google Docs look: white pages on light grey */
  html, body { margin: 0; background: #F0F4F9; }
  .docx-wrapper { background: #F0F4F9 !important; padding: 16px 12px !important; }
  .docx-wrapper > section.docx { margin-bottom: 16px !important; border-radius: 2px;
    box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15) !important; }
  #msg { color: #5F6368; font: 18px Roboto, sans-serif; text-align: center; margin-top: 40vh; }
</style>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
</head>
<body>
<div id="msg">Opening…</div>
<div id="doc"></div>
<script>
  fetch('file')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function (blob) {
      return docx.renderAsync(blob, document.getElementById('doc'), null, {
        inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: true,
        experimental: true, useBase64URL: true
      });
    })
    .then(function () { document.getElementById('msg').remove(); })
    .catch(function (e) {
      document.getElementById('msg').textContent = "Couldn't open this document (" + e.message + ")";
    });
</script>
</body>
</html>
