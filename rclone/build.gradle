// This is the rclone build script. It can build rclone binaries for any target
// architecture on any target architecture.
//
// Supported Android targets:
//  - arm-v8a (64 bit arm)
//  - arm-v7a (32 bit arm7)
//  - x86 (32 bit)
//  - x64 (64 bit)
//
// Supported host systems:
//  - linux x64
//  - macOS x64
//  - macOS arm64 (Silicon)
//  - windows x64
//
// Prerequisites:
//  - go 1.20+
//  - Either Android SDK command-line tools, or the expected NDK version (see gradle.properties).

import groovy.json.JsonSlurper
import java.nio.file.Paths

ext {
    NDK_VERSION = project.properties['de.felixnuesse.extract.ndkVersion']
    NDK_TOOLCHAIN_VERSION = project.properties['de.felixnuesse.extract.ndkToolchainVersion']
    RCLONE_VERSION = project.properties['de.felixnuesse.extract.rCloneVersion']
    GO_REQ_VERSION = project.properties['de.felixnuesse.extract.goVersion']
    RCLONE_MODULE = 'github.com/rclone/rclone'
    RCLONE_CUSTOM_VERSION_SUFFIX = '-extra'

    PROJECT_DIR = projectDir.absolutePath
    CACHE_PATH = Paths.get(PROJECT_DIR, 'cache').toString()
    
    // MODIFICA 1: Separazione GOPATH per evitare conflitti con i moduli
    GOPATH = Paths.get(PROJECT_DIR, 'gopath_env').toString()
    
    OUTPUT_BASE_PATH = Paths.get(PROJECT_DIR, '..', 'app', 'lib').toAbsolutePath().toString()
}

def findSdkDir() {
    def androidHome = System.getenv('ANDROID_HOME')
    if (androidHome != null) {
        return androidHome
    }

    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        Properties properties = new Properties()
        properties.load(localPropertiesFile.newDataInputStream())
        def sdkDir = properties.get('sdk.dir')
        if (sdkDir != null) {
            return sdkDir
        }
    }

    throw new GradleException(
        "Couldn't locate your android SDK. Make sure you set sdk.dir property"
        + " in your local.properties at the root of the project or set"
        + " ANDROID_HOME environment variable."
    )
}

def findNdkDir() {
    def sdkDir = findSdkDir()
    def ndkPath = Paths.get(sdkDir, 'ndk', NDK_VERSION).toAbsolutePath()
    if (!ndkPath.toFile().exists()) {
        // NDK not found. Let's try to install it.
        def sdkManagerPath = Paths.get(
            sdkDir,
            'cmdline-tools',
            'latest',
            'bin',
            'sdkmanager'
        ).toString()
        if (System.properties['os.name'].startsWith('Windows')) {
            sdkManagerPath += '.bat'
        }
        try {
            exec {
                commandLine sdkManagerPath, "--install", "ndk;${NDK_VERSION}"
            }
        } catch (exc) {
            logger.error(exc.toString())
            // NDK installation failed. Just raise an error.
            throw new GradleException(
                "Couldn't find a ndk bundle in ${ndkPath.toString()}. Make sure that you have the"
                + " proper version installed in Android Studio's SDK Manager or run"
                + " \"${sdkManagerPath} --install 'ndk;${NDK_VERSION}'\"."
            )
        }
    }
    return ndkPath.toString()
}

def getCrossCompiler(abi) {
    def osName = System.properties['os.name']
    def osArch = System.properties['os.arch']
    def os = null
    if (osName.startsWith('Windows') && osArch == 'amd64') {
        os = 'windows-x86_64'
    } else if (osName.startsWith('Linux') && osArch == 'amd64') {
        os = 'linux-x86_64'
    } else if (osName.startsWith('Mac') && ['aarch64', 'amd64'].contains(osArch)) {
        // Note that despite what the name suggests, the clang binary shipped
        // with the NDK is a universal object file which should work on both
        // x86_64 and arm64 (Silicon-based) architectures.
        os = 'darwin-x86_64'
    }
    if (os == null) {
        throw new GradleException('Unsupported host OS or architecture.')
    }

    def abiToCompiler = [
        'armeabi-v7a': "armv7a-linux-androideabi${NDK_TOOLCHAIN_VERSION}-clang",
        'arm64-v8a': "aarch64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86': "i686-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
        'x86_64': "x86_64-linux-android${NDK_TOOLCHAIN_VERSION}-clang",
    ]

    return Paths.get(
        findNdkDir(),
        'toolchains',
        'llvm',
        'prebuilt',
        os,
        'bin',
        abiToCompiler[abi],
    )
}

def getOutputPath(abi) {
    return Paths.get(OUTPUT_BASE_PATH, abi, 'librclone.so').toString()
}

def buildRclone(abi) {
    def abiToEnv = [
        'armeabi-v7a': ['GOARCH': 'arm', 'GOARM': '7'],
        'arm64-v8a': ['GOARCH': 'arm64'],
        'x86': ['GOARCH': '386'],
        'x86_64': ['GOARCH': 'amd64'],
    ]

    return {
        doLast {
            exec {
                environment 'GOPATH', GOPATH
                def crossCompiler = getCrossCompiler(abi)
                environment 'CC', crossCompiler
                environment 'CC_FOR_TARGET', crossCompiler
                environment 'GOOS', 'android'
                environment 'CGO_ENABLED', '1'
                environment 'CGO_LDFLAGS', '-fuse-ld=lld -Wl,--hash-style=both -s'
                abiToEnv[abi].each {entry -> environment entry.key, entry.value}
                workingDir CACHE_PATH
                def ldflags = "-buildid= -X github.com/rclone/rclone/fs.Version=${RCLONE_VERSION}${RCLONE_CUSTOM_VERSION_SUFFIX}"
                commandLine (
                    'go',
                    'build',
                    '-tags',
                    'android noselfupdate',
                    '-trimpath',
                    '-ldflags',
                    ldflags,
                    '-o',
                    getOutputPath(abi),
                    RCLONE_MODULE
                )
            }
        }
    }
}

task createRcloneModule(type: Exec) {
    onlyIf { !Paths.get(CACHE_PATH, 'go.mod').toFile().exists() }
    Paths.get(CACHE_PATH).toFile().mkdirs()
    workingDir CACHE_PATH
    environment 'GOPATH', GOPATH
    commandLine 'go', 'mod', 'init', 'rclone'
}

// [Parte precedente del file invariata...]

task checkoutRclone(dependsOn: createRcloneModule) {
    doLast {
        // stash: rclone comes from gulp79/rclone-extra (rclone with the teldrive backend) at a pinned
        // tag, v1.75.2-extra (it speaks the teldrive 1.8.x API; later releases target teldrive 2.x),
        // plus rclone/patches/*.patch (the chunkedreader fix). Cloned next to the Go module and wired
        // in with a local `replace`. Override with -Ptd.rcloneRepo=... / -Ptd.rcloneRef=...
        def REPO_URL = project.findProperty('td.rcloneRepo') ?: 'https://github.com/gulp79/rclone-extra.git'
        def REPO_REF = project.findProperty('td.rcloneRef') ?: 'v1.75.2-extra'
        def srcDir = Paths.get(CACHE_PATH, 'rclone-extra-src').toFile()
        def patchDir = Paths.get(projectDir.absolutePath, 'patches').toFile()

        if (!new File(srcDir, '.git').exists()) {
            srcDir.mkdirs()
            exec { workingDir srcDir; commandLine 'git', 'init', '-q' }
            exec { workingDir srcDir; commandLine 'git', 'remote', 'add', 'origin', REPO_URL }
        }
        println ">>> Updating ${srcDir} to ${REPO_REF}"
        exec { workingDir srcDir; commandLine 'git', 'remote', 'set-url', 'origin', REPO_URL }
        exec { workingDir srcDir; commandLine 'git', 'fetch', '--tags', 'origin', REPO_REF }
        // Reset drops previously applied patches, so they apply cleanly again.
        exec { workingDir srcDir; commandLine 'git', 'checkout', '-q', '-f', '--detach', 'FETCH_HEAD' }
        exec { workingDir srcDir; commandLine 'git', 'clean', '-fdq' }
        (patchDir.listFiles() ?: []).findAll { it.name.endsWith('.patch') }.sort { it.name }.each { patch ->
            println ">>> applying ${patch.name}"
            exec { workingDir srcDir; commandLine 'git', 'apply', '--whitespace=nowarn', patch.absolutePath }
        }
        def head = new ByteArrayOutputStream()
        exec { workingDir srcDir; commandLine 'git', 'rev-parse', '--short', 'HEAD'; standardOutput = head }
        println ">>> rclone-extra ${REPO_REF} at ${head.toString().trim()} (+ patches)"

        // 1. Local replace in go.mod
        exec {
            workingDir CACHE_PATH
            environment 'GOPATH', GOPATH
            // relative path, so no local path ends up in the binary's build info
            commandLine 'go', 'mod', 'edit', '-replace', "github.com/rclone/rclone=./rclone-extra-src"
        }

        // 2. Crea file Dummy per importare librclone
        File dummyFile = new File(Paths.get(CACHE_PATH, "dummy.go").toString())
        dummyFile.write("""package main
import _ "github.com/rclone/rclone/librclone"
func main() {}
""")

        // 3. Esegui Tidy (scarica le basi)
        exec {
            workingDir CACHE_PATH
            environment 'GOPATH', GOPATH
            commandLine 'go', 'mod', 'tidy'
        }

        // 4. Forza il download di TUTTE le dipendenze
        println ">>> RISOLUZIONE DIPENDENZE ESTESE..."
        exec {
            workingDir CACHE_PATH
            environment 'GOPATH', GOPATH
            commandLine 'go', 'build', '-mod=mod', '-v', '-o', '/dev/null', 'github.com/rclone/rclone'
        }
    }
}

// [Il resto del file tasks buildArm, buildAll, clean rimane invariato...]

task buildArm(dependsOn: checkoutRclone) {
    configure buildRclone('armeabi-v7a')
}

task buildArm64(dependsOn: checkoutRclone) {
    configure buildRclone('arm64-v8a')
}

task buildx86(dependsOn: checkoutRclone) {
    configure buildRclone('x86')
}

task buildx64(dependsOn: checkoutRclone) {
    configure buildRclone('x86_64')
}

// stash: only build the ABIs in td.abis (default arm64-v8a) to keep builds quick.
task buildAll {
    def abiTasks = ['armeabi-v7a': 'buildArm', 'arm64-v8a': 'buildArm64', 'x86': 'buildx86', 'x86_64': 'buildx64']
    (project.findProperty('td.abis') ?: 'arm64-v8a').split(',').each { dependsOn abiTasks[it.trim()] }
}

task clean {
    doLast {
        try {
            exec {
                environment 'GOPATH', GOPATH
                commandLine 'go', 'clean', '-modcache', '-cache'
            }
        } catch (ignored) {}
        delete CACHE_PATH
        delete GOPATH // Cancella anche la cartella gopath_env
        delete fileTree(OUTPUT_BASE_PATH).matching { include '**/librclone.so' }
    }
}

defaultTasks 'buildAll'
